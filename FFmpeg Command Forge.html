ull complexity, tuned for personal archives on RTX 50 series GPUs. Lower the quality value when extra detail needs to be preserved. Video settings only."},"NV SDK 13.1 AV1 \u5C42\u6B21\u5316B\u5E27\u6811":{name:"NVIDIA SDK 13.1 AV1 Hierarchical B-frames",note:"Requires FFmpeg 9.0 or later and NVIDIA driver 610 or later. Support and gains vary by GPU. Hierarchical B-frames cannot be combined with UHQ, lookahead, or internal multipass analysis. UHQ is recommended for maximum quality. For small-screen viewing, the preset author reports about 30% smaller files with hierarchical B-frames at CQ 36 versus UHQ at CQ 38. Hardware AV1 decoding is recommended because additional B-frames increase decoding cost. Video settings only."},"RTX50 HEVC UHQ":{note:"NVIDIA HEVC UHQ settings for the RTX 50 series, with compression comparable to x265 medium. Video settings only."},"SVT-AV1-HDR \u9002\u7528\u5E73\u8861\u70B9":{name:"SVT-AV1-HDR Balanced",note:"Balanced CPU-based AV1 encoding. High-resolution encoding can use substantial memory. The preset author recommends at least 32 GB RAM for 4K. Video settings only."},"x265 \u9ED8\u8BA4\u63A8\u8350\u6700\u7EC8\u538B\u5236\u65B9\u6848":{name:"x265 Recommended Final Encode",note:"Recommended x265 quality with the slow preset. Lower the quality value as needed for highly detailed scenes. Video settings only."},"x264 \u6700\u7EC8\u538B\u5236":{name:"x264 Final Encode",note:"Recommended x264 quality with the slower preset. Lower the quality value as needed for highly detailed scenes. Video settings only."},"FDK AAC \u538B\u5236\u97F3\u9891\u5230 M4A":{name:"FDK AAC Audio to M4A",note:"Compact, near-transparent AAC audio with support for metadata and artwork. Requires an FFmpeg build with FDK AAC. The preset author notes a possible 16-bit input limitation."},"AVIF \u9AD8\u538B\u7F29\u56FE\u7247 AOM AV1":{name:"AVIF High Compression (AOM AV1)",note:"Compress images with AV1 in AVIF using AOM. The preset author reports around VMAF 96 at CRF 18 and suggests CRF 12 for higher quality. If colors look wrong, check the pixel format under Color Management."},"JPEG XL \u9AD8\u538B\u7F29\u56FE\u7247":{name:"JPEG XL High Compression",note:"JPEG XL targets compact, visually lossless images and supports lossless encoding and HDR. Files can be larger than AVIF, with better detail retention."},"Windows \u6807\u51C6\u591A\u5C3A\u5BF8 ICO \u56FE\u6807":{name:"Windows Multi-size ICO Icon",note:"Create a Windows ICO with 16, 24, 32, 48, 64, 128, and 256 px images. The smaller sizes use BMP and BGRA for transparency. The 256 px image uses PNG and RGBA. Non-square inputs are scaled proportionally and padded with transparency."},"AOM-AVIF":{note:"Visually lossless AVIF encoding with AOM. Encoding is single-threaded. Run multiple jobs for higher throughput. The preset author also provides AWJimage: https://github.com/Dominic485649/AWJimage"},"NMR-AAC":{note:"Encode perceptually transparent AAC while retaining cover art and lyrics when present. Builds: https://github.com/Dominic485649/ffmpeg-nvenc-lite or https://github.com/Dominic485649/ffmpeg-full"},"NVENC-AV1-Fast":{note:"Requires NVIDIA driver 610 or later and an RTX 40 or 50 series GPU. High-quality hardware AV1 at about three times the speed of the standard preset, with a small quality trade-off. Perceptually transparent audio."},"NVENC-AV1":{note:"Requires NVIDIA driver 610 or later and an RTX 40 or 50 series GPU. High-quality hardware AV1 with perceptually transparent audio."},"NVENC-HEVC-Fast":{note:"Requires NVIDIA driver 610 or later and an RTX 30, 40, or 50 series GPU. High-quality hardware HEVC at about three times the speed of the standard preset, with a small quality trade-off. Perceptually transparent audio."},"NVENC-HEVC-LowRate":{note:"Requires NVIDIA driver 610 or later and an RTX 30, 40, or 50 series GPU. The preset author reports about 10% smaller files and roughly one-third lower encoding speed than the standard preset. Perceptually transparent audio."},
