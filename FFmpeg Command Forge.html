IA SDK 13.1 AV1 Hierarchical B-frames",note:"Requires FFmpeg 9.0 or later and NVIDIA driver 610 or later. Support and gains vary by GPU. Hierarchical B-frames cannot be combined with UHQ, lookahead, or internal multipass analysis. UHQ is recommended for maximum quality. For small-screen viewing, the preset author reports about 30% smaller files with hierarchical B-frames at CQ 36 versus UHQ at CQ 38. Hardware AV1 decoding is recommended because additional B-frames increase decoding cost. Video settings only."},"RTX50 HEVC UHQ":{note:"NVIDIA HEVC UHQ settings for the RTX 50 series, with compression comparable to x265 medium. Video settings only."},"SVT-AV1-HDR \u9002\u7528\u5E73\u8861\u70B9":{name:"SVT-AV1-HDR Balanced",note:"Balanced CPU-based AV1 encoding. High-resolution encoding can use substantial memory. The preset author recommends at least 32 GB RAM for 4K. Video settings only."},"x265 \u9ED8\u8BA4\u63A8\u8350\u6700\u7EC8\u538B\u5236\u65B9\u6848":{name:"x265 Recommended Final Encode",note:"Recommended x265 quality with the slow preset. Lower the quality value as needed for highly detailed scenes. Video settings only."},"x264 \u6700\u7EC8\u538B\u5236":{name:"x264 Final Encode",note:"Recommended x264 quality with the slower preset. Lower the quality value as needed for highly detailed scenes. Video settings only."},"FDK AAC \u538B\u5236\u97F3\u9891\u5230 M4A":{name:"FDK AAC Audio to M4A",note:"Compact, near-transparent AAC audio with support for metadata and artwork. Requires an FFmpeg build with FDK AAC. The preset author notes a possible 16-bit input limitation."},"AVIF \u9AD8\u538B\u7F29\u56FE\u7247 AOM AV1":{name:"AVIF High Compression (AOM AV1)",note:"Compress images with AV1 in AVIF using AOM. The preset author reports around VMAF 96 at CRF 18 and suggests CRF 12 for higher quality. If colors look wrong, check the pixel format under Color Management."},"JPEG XL \u9AD8\u538B\u7F29\u56FE\u7247":{name:"JPEG XL High Compression",note:"JPEG XL targets compact,
