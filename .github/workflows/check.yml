name: 校验单文件与跨平台命令
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- 'FFmpeg Command Forge.html'
      - if: runner.os == 'Linux'
        run: npm exec -- playwright install --with-deps --only-shell chromium
      - if: runner.os == 'Linux'
        run: npm run test:browser
        env:
          FORGE_BROWSER: chromium
