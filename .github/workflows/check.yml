name: 校验与部署 GitHub Pages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- 'FFmpeg Command Forge.html'
      - if: runner.os == 'Linux'
        run: npm exec -- playwright install --with-deps --only-shell chromium
      - if: runner.os == 'Linux'
        run: npm run test:browser
        env:
          FORGE_BROWSER: chromium
      # Only the validated Ubuntu files become the deployment artifact.
      - if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: 发布本次验证产物
        id: deployment
        uses: actions/deploy-pages@v4
